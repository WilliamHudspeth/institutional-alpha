# Per-ticker thesis constraints. One file per ticker, committed to the repo so
# it is git-diffable, human-auditable, and hashable into manifest.json.
#
# Each constraint registers a bound the active thesis depends on. A breach
# degrades the verdict confidence band by `severity` levels (capped at 2 total
# across all breaches by DriftReport). It never changes a fair value.
#
# `metric` must be one of iam.thesis.drift.METRIC_RESOLVERS (closed set).
# Loading a file that names an unknown metric fails immediately.

ticker: AAPL
thesis: "Platform compounder; durable high ROIC funds buybacks and the re-rating."
registered: 2026-06-13

constraints:
  - id: roic_floor
    metric: roic_durability
    comparator: ">="
    bound: 0.15
    severity: 1
    supports: Bull
    note: "Thesis assumes sustained, defensible returns on capital."

  - id: growth_floor
    metric: revenue_growth_ttm
    comparator: ">="
    bound: 0.04
    severity: 1
    supports: Base
    note: "Below ~4% TTM growth the compounder framing weakens."

  - id: leverage_ceiling
    metric: debt_to_ebitda
    comparator: "<="
    bound: 3.0
    severity: 2
    supports: Bull
    note: "Buyback-funded re-rating breaks if the balance sheet levers up."

  - id: fragility_ceiling
    metric: fragility
    comparator: "<="
    bound: 0.55
    severity: 1
    note: "Rising fragility means a small miss compresses the multiple."
