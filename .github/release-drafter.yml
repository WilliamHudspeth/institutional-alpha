name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
change-template: '- $TITLE (@$AUTHOR) (#$NUMBER)'
change-title-escapes: '\<*_&'

categories:
  - title: '🚨 Security'
    labels:
      - security
  - title: '🎉 Features'
    labels:
      - feat
  - title: '🐛 Bug Fixes'
    labels:
      - fix
  - title: '📚 Documentation'
    labels:
      - docs
  - title: '⚡ Performance'
    labels:
      - perf
  - title: '🔧 Refactoring'
    labels:
      - refactor
  - title: '✅ Tests'
    labels:
      - test
  - title: '🏗️ Chores'
    labels:
      - chore

exclude-labels:
  - skip-changelog

template: |
  ## What's Changed

  $CHANGES

  ## Commits

  $CONTRIBUTORS

  ---

  **Release Notes**: This release includes changes from Conventional Commits.
  See CONTRIBUTING.md for commit message format.

autolabeler:
  - label: feat
    title:
      - '/^feat(\(.+\))?:/i'
  - label: fix
    title:
      - '/^fix(\(.+\))?:/i'
  - label: docs
    title:
      - '/^docs(\(.+\))?:/i'
  - label: test
    title:
      - '/^test(\(.+\))?:/i'
  - label: perf
    title:
      - '/^perf(\(.+\))?:/i'
  - label: refactor
    title:
      - '/^refactor(\(.+\))?:/i'
  - label: chore
    title:
      - '/^chore(\(.+\))?:/i'
  - label: security
    title:
      - '/^security(\(.+\))?:/i'
