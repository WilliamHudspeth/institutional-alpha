name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-artifacts:
    name: Build Executables
    runs-on: ${{ matrix.os }}
    needs: build-and-release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: institutional-alpha.exe
            asset_name: institutional-alpha-windows.exe
          - os: macos-latest
            artifact_name: institutional-alpha
            asset_name: institutional-alpha-macos.dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,data,live,backtest]"
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --name institutional-alpha --onefile src/iam/launcher.py

      - name: Create DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install create-dmg
          mkdir -p dist/dmg_source
          cp dist/institutional-alpha dist/dmg_source/
          create-dmg \
            --volname "Institutional Alpha" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            "dist/institutional-alpha-macos.dmg" \
            "dist/dmg_source/"

      - name: Rename Windows Executable
        if: matrix.os == 'windows-latest'
        run: mv dist/institutional-alpha.exe dist/institutional-alpha-windows.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
